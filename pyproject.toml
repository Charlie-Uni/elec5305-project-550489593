[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "elec5305-semantic-interference"
version = "0.1.0"
description = "Controlled environmental-sound experiments with clean ESC-50 SVM and CNN baselines"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26,<3",
  "scipy>=1.12,<2",
  "scikit-learn>=1.4,<2",
  "soundfile>=0.12,<1",
  "joblib>=1.3,<2",
  "threadpoolctl>=3.2,<4",
]

[project.optional-dependencies]
cnn = ["torch>=2.6,<3"]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]
docs = ["reportlab>=4,<6", "pypdf>=5,<7", "pypdfium2>=4,<6"]
figures = ["matplotlib>=3.8,<4"]

[project.scripts]
esc-baseline = "esc_robustness.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
